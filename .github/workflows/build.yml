name: Build CI

# Manual only, to keep CI noise down while the npm publishing setup is being
# sorted out. Restore the push and pull_request triggers below once it is stable,
# so that pull requests get build feedback again.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: |
            .turbo/cache
            node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run lint, type checks and tests
        run: yarn verify

      - name: Build
        run: yarn turbo run build --concurrency=2
