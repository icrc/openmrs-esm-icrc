# One-off workflow to create the @icrc/* packages on npmjs.org.
#
# Trusted publishing (OIDC) cannot create a package that does not exist yet: a
# trusted publisher is configured on a package's settings page on npmjs.com, and
# that page only exists once something has published the package. npmjs.org has
# no "create package" button, so the first publish of every new package has to be
# authenticated with a token.
#
# Run this once, then for each package configure the trusted publisher, revoke the
# NPM_TOKEN secret and delete this file. Publish.yml then runs without any secret.
name: Bootstrap npm packages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "bootstrap" to confirm a token-authenticated publish'
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 45
    steps:
      - name: Require explicit confirmation
        if: inputs.confirm != 'bootstrap'
        run: |
          echo "::error::Refusing to run. Type 'bootstrap' in the confirm input to proceed."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        timeout-minutes: 10
        run: yarn install --immutable

      # Distinct prerelease identifier so a bootstrap version can never collide
      # with, or sort above, the -pre.N versions that publish.yml produces.
      - name: Set bootstrap version
        run: |
          BASE=$(node -e "const v=require('./lerna.json').version; if(!v) throw new Error('no version in lerna.json'); console.log(v)")
          yarn lerna version "${BASE}-bootstrap.${{ github.run_number }}" --no-git-tag-version --no-push --yes

      # Lint and tests are skipped: these versions exist only to create the
      # package names, and are parked on the "bootstrap" dist-tag so that neither
      # "latest" nor "pre" ever resolves to them.
      - name: Build
        timeout-minutes: 20
        run: yarn turbo run build --concurrency=2

      - name: Publish bootstrap versions
        timeout-minutes: 15
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: yarn workspaces foreach -A --no-private --topological exec npm publish --access public --tag bootstrap
